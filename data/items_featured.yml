title : "Featured Builds"
content: |
  A few projects that best represent what I am actively exploring right now: practical hardware, AI experiments, and web/API systems.
style: "style1 medium onscroll-fade-in"
items:
  - name : "schrody-sensor"
    content : "Low-power temperature sensor firmware for ESP32-C6 with ESPHome and OpenThread, including docs for setup, pinout, and design decisions."
    style : "solid style2 major fa-thermometer-half"
    link : "https://github.com/bradreimer/schrody-sensor"

  - name : "doorbell_compliment_service"
    content : "A FastAPI service on Jetson Orin Nano that analyzes doorbell images and generates personalized compliments for Home Assistant workflows."
    style : "solid style2 major fa-robot"
    link : "https://github.com/bradreimer/doorbell_compliment_service"

  - name : "trmnl-byos-aspnet"
    content : "An ASP.NET implementation of the TRMNL BYOS server with strongly-typed endpoints, Docker deployment, and Synology-friendly setup."
    style : "solid style2 major fa-server"
    link : "https://github.com/bradreimer/trmnl-byos-aspnet"
