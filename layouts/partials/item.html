<section>
    <span class="icon {{ .style }}"></span>
    <h3>{{ .name }}</h3>
    <p>{{ .content | safeHTML }}</p>
    {{ with .link }}
    <ul class="actions stacked">
        <li><a href="{{ . }}" class="button small" target="_blank" rel="noopener noreferrer">View Project</a></li>
    </ul>
    {{ end }}
</section>
